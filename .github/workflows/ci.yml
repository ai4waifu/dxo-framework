name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --release
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Install JS workspace
        run: pnpm install --no-frozen-lockfile
      - name: Install wasm-pack
        run: curl https://rustwasm.github.io/wasm-pack/installer/init.sh -sSf | sh
      - name: Add wasm32 target
        run: rustup target add wasm32-unknown-unknown
      - name: Biome
        run: pnpm run lint
      # Glue + .wasm → @dxo/lite-unknown-wasm32/dist (gitignored); required before @dxo/lite tsc.
      - name: Build lite WASM artifact
        run: pnpm run build:lite-wasm
      - name: Build TypeScript packages
        run: pnpm run build:ts
      - name: Build native addon
        run: pnpm run build:native
      - name: JS verify
        run: pnpm run test:verify
