[workspace]
resolver = "2"
members = [
    "projects/dxo.rs/crates/dxo-core",
    "projects/dxo.rs/crates/dxo-download",
    "projects/dxo.rs/crates/dxo-napi",
    "projects/dxo.rs/crates/dxo-studio",
    "projects/dxo.rs/crates/dxo-studio-tauri",
    "projects/dxo.rs/crates/dxo-lite-wasm",
]
default-members = ["projects/dxo.rs/crates/dxo-core"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
authors = ["DXO Contributors"]
repository = "https://github.com/ai4waifu/dxo-framework"
rust-version = "1.77"

[workspace.dependencies]
dxo-core = { path = "projects/dxo.rs/crates/dxo-core" }
dxo-download = { path = "projects/dxo.rs/crates/dxo-download" }
dxo-studio = { path = "projects/dxo.rs/crates/dxo-studio" }
rand = "0.10.2"
napi = { version = "3.12.1", default-features = true, features = ["napi4"] }
napi-derive = "3.6.3"
titan-backend-cpu = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-backend-cuda = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-graph = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-hal = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-runtime = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-tensor = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
titan-types = { git = "https://github.com/ai4waifu/titan.rs.git", branch = "dev" }
ucf = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev", default-features = false }
ucf-backend-cuda = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-ir = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-scheduler = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-types = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
ucf-runtime = { git = "https://github.com/muse-gpt/ucf.rs.git", branch = "dev" }
# Boost DL/ML：训练图与优化器固定到 boost.rs 的明确提交，不复用 titan 的第二套图。
boost-net = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
dl-types = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
dl-tensor = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
dl-graph = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
dl-train = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
dl-nn = { git = "https://github.com/oovm/boost.rs.git", rev = "fd94618129df6cba696d0da1013052baab42c813" }
# 临时本地 path 依赖：boost.rs 远端尚未包含 data-binary-dxo 提交，可推送后改回 git rev。
data-binary-dxo = { path = "../../vmz 全栈开发/rust-boost/projects/data/data.binary.dxo" }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[workspace.lints.rust]
missing_docs = "deny"
missing_debug_implementations = "warn"
unsafe_code = "warn"
